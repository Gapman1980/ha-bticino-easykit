name: BTicino EASY KIT
version: "1.1.1"
slug: bticino_easykit
description: BTicino EASY KIT Connected door entry in Home Assistant - ring, missed call, live video (also while ringing), snapshots, gate/door opening, ring history. Unofficial.
url: https://github.com/Gapman1980/ha-bticino-easykit
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
host_network: true
ingress: true
ingress_port: 8095
panel_icon: mdi:doorbell-video
panel_title: Videocitofono
hassio_api: true
homeassistant_api: true
services:
  - mqtt:need
map:
  - homeassistant_config:rw
options:
  language: it
  camera_index: 1
  foto_allo_squillo: true
  rtsp_port: 8564
  http_port: 8098
  login_port: 8096
  debug: false
schema:
  language: list(it|en)
  camera_index: int(1,4)
  foto_allo_squillo: bool
  rtsp_port: port
  http_port: port
  login_port: port
  login_host: str?
  plant_id: str?
  debug: bool
