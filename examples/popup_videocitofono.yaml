          '<div class="cf"></div>' +
          (L.length ? '<div class="ls">' + righe + '</div>' : '<div class="vuoto"><ha-icon icon="mdi:bell-sleep-outline"></ha-icon>Nessuna chiamata registrata</div>') +
          (v.length > 5 ? '<div class="piu">+ ' + (v.length - 5) + ' più vecchie (la scopa elimina anche queste)</div>' : '') + '</div>';
        ]]]
