          const gg = d.toDateString() === oggi.toDateString() ? 'oggi' : d.toDateString() === ieri.toDateString() ? 'ieri'
                   : GG[d.getDay()] + ' ' + d.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit' });
          const nuova = x.nuova || ev.includes(x.id);
          const img = x.foto
            ? '<img src="' + x.foto + '" loading="lazy" data-act="zoom" data-src="' + att(x.foto) + '" data-tit="' + att(e[2] + ' · ' + gg + ' ' + ora) + '" onpointerdown="window.__vcDown(event)" onpointerup="window.__vcAct(event)">'
            : '<div class="noimg"><ha-icon icon="mdi:image-off-outline"></ha-icon></div>';
          return '<div class="it' + (nuova ? ' nv' : '') + '" data-id="' + att(x.id) + '" style="--c:' + e[0] + ';--i:' + i + '">' + img +
            '<div class="tx"><span class="es"><ha-icon icon="' + e[1] + '"></ha-icon>' + e[2] + (nuova ? '<em>NUOVA</em>' : '') + '</span>' +
            '<b>' + ora + '</b><small>' + gg + '</small></div>' +
            '<button class="bt del" data-act="elimina" data-id="' + att(x.id) + '" data-txt="' + att('Eliminare la chiamata di ' + gg + ' alle ' + ora + '?') + '" onpointerdown="window.__vcDown(event)" onpointerup="window.__vcAct(event)"><ha-icon icon="mdi:trash-can-outline"></ha-icon></button></div>';
        }).join('');
        return '<div class="st"><div class="hd"><ha-icon icon="mdi:history"></ha-icon><div class="ti"><b>Ultime chiamate</b><small>tocca la foto per ingrandirla · 🗑️ per eliminare</small></div>' +
