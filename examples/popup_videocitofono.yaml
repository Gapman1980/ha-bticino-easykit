# Popup Videocitofono / Door entry popup
# IT: aggiungi questa card in una sezione della tua dashboard (Modifica dashboard > + > Manuale). Non si vede: si apre con la mini card.
# EN: add this card to any section of your dashboard (Edit dashboard > + > Manual). It is invisible: the mini card opens it.
# Richiede / Requires: button-card, card-mod, browser_mod (HACS).
# Se le tue serrature hanno altri nomi, cambia button.videocitofono_apri_cancello / _apri_cancelletto.
# If your locks have other names, change button.videocitofono_apri_cancello / _apri_cancelletto.
# 1.1.0: storico ultime 5 chiamate, tocco foto = schermo intero, cestino = una, scopa = tutte (con conferma).
#        history of the last 5 calls, tap photo = full screen, trash = one, broom = all (confirmed).

type: custom:popup-card
popup_card_id: videocitofono
title: Videocitofono
size: wide
dismissable: true
card:
  type: vertical-stack
  cards:
  - type: custom:button-card
    entity: binary_sensor.videocitofono_squillo
    show_name: false
    show_state: false
    show_icon: false
    update_timer: 2
    tap_action:
      action: none
    hold_action:
      action: none
    styles:
      card:
      - padding: '0'
      - background: transparent
      - border: none
      - box-shadow: none
      - overflow: visible
      grid:
      - grid-template-areas: '"h"'
      - grid-template-columns: 1fr
      custom_fields:
        h:
        - width: 100%
    custom_fields:
      h: |-
        [[[
        window.__vcEl = this; window.__vcHass = hass;
        if (!window.__vcBattito) window.__vcBattito = setInterval(() => {
          const el = window.__vcEl;
          if (el && el.isConnected && !document.hidden && window.__vcHass) window.__vcHass.callService('mqtt', 'publish', { topic: 'bticino_easykit/cmd/vivo', payload: '1' }).catch(() => {});
        }, 1500);

        const st = (e) => (states[e] || {}).state;
        const ring = st('binary_sensor.videocitofono_squillo') === 'on';
        const talk = st('binary_sensor.videocitofono_occupato') === 'on';
        const ok = st('binary_sensor.videocitofono_connesso') === 'on';
        const m = ring ? { c: '#FF1744', c2: '#FF9100', ic: 'mdi:bell-ring', t: 'Stanno suonando!', cl: 'ring' }
                : talk ? { c: '#00E676', c2: '#00E5FF', ic: 'mdi:account-voice', t: 'In conversazione', cl: 'talk' }
                : { c: '#FFB300', c2: '#00E5FF', ic: 'mdi:doorbell-video', t: 'Ingresso', cl: 'idle' };
        const u = states['sensor.videocitofono_ultimo_squillo'];
        let sub = 'Pulsantiera BTicino · Easy Kit';
        if (u && !['unknown','unavailable'].includes(u.state)) {
          const d = new Date(u.state), oggi = new Date().toDateString() === d.toDateString();
          sub = 'Ultimo squillo ' + (oggi ? 'oggi' : d.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit'})) + ' alle ' + d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
        }
        if (!ok) sub = 'Non collegato a BTicino';
        const onde = ring ? '<i class="w"></i><i class="w"></i><i class="w"></i>' : '';
        const eq = talk ? '<div class="eq"><i></i><i></i><i></i><i></i></div>' : '';
        return '<div class="hd ' + m.cl + '" style="--c:' + m.c + ';--c2:' + m.c2 + '"><div class="in">' +
          '<div class="ic">' + onde + '<ha-icon icon="' + m.ic + '"></ha-icon></div>' +
          '<div class="tx"><b>' + m.t + '</b><div class="mq"><span class="sc">' + sub + ' &nbsp;&nbsp;•&nbsp;&nbsp; ' + sub + ' &nbsp;&nbsp;•&nbsp;&nbsp; </span></div>' + eq + '</div>' +
          '</div></div>';
        ]]]
    extra_styles: |2-

      .hd { position: relative; border-radius: 24px; padding: 2px; overflow: hidden; isolation: isolate; }
      .hd::before { content: ''; position: absolute; inset: -60%; z-index: -1; background: conic-gradient(from 0deg, var(--c), transparent 22%, var(--c2) 50%, transparent 72%, var(--c)); animation: vc_rot 5s linear infinite; }
      .hd.ring::before { animation-duration: 1.6s; }
      @keyframes vc_rot { to { transform: rotate(360deg); } }
      .in { position: relative; display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 22px; overflow: hidden;
            background: radial-gradient(120% 160% at 0% 0%, rgba(255,255,255,.07), transparent 55%), linear-gradient(135deg, #0b1020 0%, #121a35 60%, #0b1020 100%); color: #fff; }
      .in::after { content: ''; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.08) 50%, transparent 65%); transform: translateX(-100%); animation: vc_luce 4.5s ease-in-out infinite; pointer-events: none; }
      @keyframes vc_luce { 60%,100% { transform: translateX(100%); } }
      .ic { position: relative; flex: none; width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center;
            background: radial-gradient(circle, color-mix(in srgb, var(--c) 45%, transparent), transparent 70%); box-shadow: 0 0 0 2px color-mix(in srgb, var(--c) 70%, transparent), 0 0 20px color-mix(in srgb, var(--c) 55%, transparent); }
      .ic ha-icon { --mdc-icon-size: 32px; color: #fff; filter: drop-shadow(0 0 8px var(--c)); animation: vc_resp 2.6s ease-in-out infinite; }
      .ring .ic ha-icon { animation: vc_sh .45s ease-in-out infinite; }
      @keyframes vc_resp { 50% { transform: scale(1.12); } }
      @keyframes vc_sh { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-18deg); } 75% { transform: rotate(18deg); } }
      .w { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--c); opacity: 0; animation: vc_onda 1.8s ease-out infinite; }
      .w:nth-child(2) { animation-delay: .6s; } .w:nth-child(3) { animation-delay: 1.2s; }
      @keyframes vc_onda { 0% { transform: scale(.95); opacity: .9; } 100% { transform: scale(1.45); opacity: 0; } }
      .tx { flex: 1; min-width: 0; text-align: left; }
      .tx b { display: block; font-size: 20px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: .2px; text-shadow: 0 0 14px color-mix(in srgb, var(--c) 60%, transparent); }
      .tx .mq { overflow: hidden; white-space: nowrap; margin-top: 2px;
                -webkit-mask-image: linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent); mask-image: linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent); }
      .tx .mq .sc { display: inline-block; font-size: 12.5px; color: #aab6c8; animation: vc_mq 14s linear infinite; will-change: transform; }
      @keyframes vc_mq { from { transform: translateX(0); } to { transform: translateX(-50%); } }
      .eq { display: flex; gap: 4px; align-items: flex-end; height: 16px; margin-top: 6px; }
      .eq i { width: 5px; border-radius: 3px; background: var(--c); box-shadow: 0 0 6px var(--c); animation: vc_eq .8s ease-in-out infinite; }
      .eq i:nth-child(2) { animation-delay: .15s; } .eq i:nth-child(3) { animation-delay: .3s; } .eq i:nth-child(4) { animation-delay: .45s; }
      @keyframes vc_eq { 0%,100% { height: 4px; } 50% { height: 16px; } }
      .lv { flex: none; display: flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 20px; background: rgba(255,23,68,.14); border: 1px solid #FF1744; font-size: 11.5px; font-weight: 800; letter-spacing: 1.2px; }
      .lv i { width: 8px; height: 8px; border-radius: 50%; background: #FF1744; box-shadow: 0 0 8px 2px #FF1744; animation: vc_lamp 1.1s ease-in-out infinite; }
      @keyframes vc_lamp { 50% { opacity: .2; } }
  - type: conditional
    conditions:
    - condition: or
      conditions:
      - condition: state
        entity: binary_sensor.videocitofono_squillo
        state_not: 'on'
      - condition: state
        entity: switch.videocitofono_anteprima
        state: 'on'
    - condition: state
      entity: binary_sensor.videocitofono_occupato
      state_not: 'on'
    card:
      type: picture-entity
      entity: camera.videocitofono_video
      camera_view: live
      aspect_ratio: '4:3'
      show_name: false
      show_state: false
      tap_action:
        action: none
      hold_action:
        action: none
      card_mod:
        style: |-
          ha-card { position: relative; border-radius: 22px; overflow: hidden; border: none !important;
            background: #0b1020 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 300' preserveAspectRatio='xMidYMid slice'><defs><radialGradient id='g' cx='50%' cy='42%' r='75%'><stop offset='0' stop-color='%23182a52'/><stop offset='1' stop-color='%230b1020'/></radialGradient></defs><rect width='400' height='300' fill='url(%23g)'/><circle cx='200' cy='122' r='30' fill='none' stroke='%2300E5FF' stroke-opacity='.18' stroke-width='6'/><path d='M200 92 a30 30 0 0 1 30 30' fill='none' stroke='%2300E5FF' stroke-width='6' stroke-linecap='round'><animateTransform attributeName='transform' type='rotate' from='0 200 122' to='360 200 122' dur='0.9s' repeatCount='indefinite'/></path><text x='200' y='192' text-anchor='middle' font-family='Helvetica,Arial,sans-serif' font-size='28' font-weight='800' fill='%23ffffff'>Loading<tspan>.<animate attributeName='opacity' values='0;1;1;0' dur='1.2s' repeatCount='indefinite'/></tspan><tspan>.<animate attributeName='opacity' values='0;0;1;0' dur='1.2s' repeatCount='indefinite'/></tspan><tspan>.<animate attributeName='opacity' values='0;0;0;1;0' dur='1.2s' repeatCount='indefinite'/></tspan></text><text x='200' y='222' text-anchor='middle' font-family='Helvetica,Arial,sans-serif' font-size='13' fill='%2390a4ae'>Collegamento alla pulsantiera</text></svg>") center / cover no-repeat !important;
            box-shadow: 0 0 0 2px #00E5FF66, 0 0 24px #00E5FF44, 0 10px 30px rgba(0,0,0,.45) !important; }
          hui-image, ha-camera-stream, .image { background: transparent !important; }
          ha-card::before { content: ''; position: absolute; inset: 0; z-index: 2; pointer-events: none; background: linear-gradient(#00E5FF,#00E5FF) top 10px left 10px / 22px 3px no-repeat, linear-gradient(#00E5FF,#00E5FF) top 10px left 10px / 3px 22px no-repeat, linear-gradient(#00E5FF,#00E5FF) top 10px right 10px / 22px 3px no-repeat, linear-gradient(#00E5FF,#00E5FF) top 10px right 10px / 3px 22px no-repeat, linear-gradient(#00E5FF,#00E5FF) bottom 10px left 10px / 22px 3px no-repeat, linear-gradient(#00E5FF,#00E5FF) bottom 10px left 10px / 3px 22px no-repeat, linear-gradient(#00E5FF,#00E5FF) bottom 10px right 10px / 22px 3px no-repeat, linear-gradient(#00E5FF,#00E5FF) bottom 10px right 10px / 3px 22px no-repeat, radial-gradient(130% 100% at 50% 50%, transparent 62%, rgba(0,0,0,.55)); filter: drop-shadow(0 0 4px #00E5FF); }
          ha-card::after { content: '● LIVE'; position: absolute; top: 14px; left: 50%; transform: translateX(-50%); z-index: 3; padding: 4px 11px; border-radius: 12px;
            background: rgba(10,14,28,.55); border: 1px solid #FF1744AA; color: #fff; font: 800 11px/1 system-ui, sans-serif; letter-spacing: 1.3px;
            -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); animation: vc_lv 1.4s ease-in-out infinite; }
          @keyframes vc_lv { 50% { box-shadow: 0 0 12px #FF1744; color: #FF8A80; } }
  - type: conditional
    conditions:
    - condition: state
      entity: binary_sensor.videocitofono_squillo
      state: 'on'
    - condition: state
      entity: switch.videocitofono_anteprima
      state_not: 'on'
    card:
      type: custom:button-card
      show_name: false
      show_state: false
      show_icon: false
      tap_action:
        action: none
      styles:
        card:
        - padding: '0'
        - background: transparent
        - border: none
        - box-shadow: none
        grid:
        - grid-template-areas: '"m"'
        - grid-template-columns: 1fr
        custom_fields:
          m:
          - width: 100%
      custom_fields:
        m: <div class="box"><div class="bolla"><i class="w"></i><i class="w"></i><i class="w"></i><ha-icon icon="mdi:phone-ring"></ha-icon></div><b>In chiamata con il monitor</b><span>Il video parte appena finisce lo squillo</span></div>
      extra_styles: |2-

        .box { position: relative; aspect-ratio: 4 / 3; border-radius: 22px; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; color: #fff;
               background: linear-gradient(#FF1744,#FF1744) top 10px left 10px / 22px 3px no-repeat, linear-gradient(#FF1744,#FF1744) top 10px left 10px / 3px 22px no-repeat, linear-gradient(#FF1744,#FF1744) top 10px right 10px / 22px 3px no-repeat, linear-gradient(#FF1744,#FF1744) top 10px right 10px / 3px 22px no-repeat, linear-gradient(#FF1744,#FF1744) bottom 10px left 10px / 22px 3px no-repeat, linear-gradient(#FF1744,#FF1744) bottom 10px left 10px / 3px 22px no-repeat, linear-gradient(#FF1744,#FF1744) bottom 10px right 10px / 22px 3px no-repeat, linear-gradient(#FF1744,#FF1744) bottom 10px right 10px / 3px 22px no-repeat, radial-gradient(60% 55% at 50% 42%, #FF174433, transparent 70%), linear-gradient(160deg, #10162c, #0b1020);
               box-shadow: 0 0 0 2px #FF174477, 0 0 24px #FF174444; }
        .bolla { position: relative; width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle, #FF174455, transparent 70%); box-shadow: 0 0 0 2px #FF1744AA, 0 0 26px #FF174488; }
        .bolla ha-icon { --mdc-icon-size: 44px; color: #fff; filter: drop-shadow(0 0 10px #FF1744); animation: vc_sh .5s ease-in-out infinite; }
        .w { position: absolute; inset: 0; border-radius: 50%; border: 2px solid #FF1744; opacity: 0; animation: vc_onda 2s ease-out infinite; }
        .w:nth-child(2) { animation-delay: .66s; } .w:nth-child(3) { animation-delay: 1.33s; }
        @keyframes vc_onda { 0% { transform: scale(.9); opacity: .9; } 100% { transform: scale(2.3); opacity: 0; } }
        @keyframes vc_sh { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-16deg); } 75% { transform: rotate(16deg); } }
        @keyframes vc_resp { 50% { transform: scale(1.12); } }
        .box b { font-size: 19px; font-weight: 800; text-shadow: 0 0 12px #FF1744; margin-top: 6px; } .box span { font-size: 12.5px; color: #aab6c8; padding: 0 14px; }
        .eq { display: flex; gap: 5px; align-items: flex-end; height: 24px; margin-top: 4px; }
        .eq i { width: 6px; border-radius: 3px; background: #FF9100; box-shadow: 0 0 6px #FF9100; animation: vc_eq .85s ease-in-out infinite; }
        .eq i:nth-child(2) { animation-delay: .15s; } .eq i:nth-child(3) { animation-delay: .3s; } .eq i:nth-child(4) { animation-delay: .45s; } .eq i:nth-child(5) { animation-delay: .6s; }
        @keyframes vc_eq { 0%,100% { height: 5px; } 50% { height: 24px; } }
  - type: conditional
    conditions:
    - condition: state
      entity: binary_sensor.videocitofono_occupato
      state: 'on'
    card:
      type: custom:button-card
      show_name: false
      show_state: false
      show_icon: false
      tap_action:
        action: none
      styles:
        card:
        - padding: '0'
        - background: transparent
        - border: none
        - box-shadow: none
        grid:
        - grid-template-areas: '"m"'
        - grid-template-columns: 1fr
        custom_fields:
          m:
          - width: 100%
      custom_fields:
        m: <div class="box"><div class="bolla"><i class="w"></i><i class="w"></i><i class="w"></i><ha-icon icon="mdi:account-voice"></ha-icon></div><b>Conversazione in corso dal monitor</b><span>Il video riparte appena finisce la conversazione</span><div class="eq"><i></i><i></i><i></i><i></i><i></i></div></div>
      extra_styles: |2-

        .box { position: relative; aspect-ratio: 4 / 3; border-radius: 22px; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; color: #fff;
               background: linear-gradient(#00E676,#00E676) top 10px left 10px / 22px 3px no-repeat, linear-gradient(#00E676,#00E676) top 10px left 10px / 3px 22px no-repeat, linear-gradient(#00E676,#00E676) top 10px right 10px / 22px 3px no-repeat, linear-gradient(#00E676,#00E676) top 10px right 10px / 3px 22px no-repeat, linear-gradient(#00E676,#00E676) bottom 10px left 10px / 22px 3px no-repeat, linear-gradient(#00E676,#00E676) bottom 10px left 10px / 3px 22px no-repeat, linear-gradient(#00E676,#00E676) bottom 10px right 10px / 22px 3px no-repeat, linear-gradient(#00E676,#00E676) bottom 10px right 10px / 3px 22px no-repeat, radial-gradient(60% 55% at 50% 42%, #00E67633, transparent 70%), linear-gradient(160deg, #10162c, #0b1020);
               box-shadow: 0 0 0 2px #00E67677, 0 0 24px #00E67644; }
        .bolla { position: relative; width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle, #00E67655, transparent 70%); box-shadow: 0 0 0 2px #00E676AA, 0 0 26px #00E67688; }
        .bolla ha-icon { --mdc-icon-size: 44px; color: #fff; filter: drop-shadow(0 0 10px #00E676); animation: vc_resp 1.6s ease-in-out infinite; }
        .w { position: absolute; inset: 0; border-radius: 50%; border: 2px solid #00E676; opacity: 0; animation: vc_onda 2s ease-out infinite; }
        .w:nth-child(2) { animation-delay: .66s; } .w:nth-child(3) { animation-delay: 1.33s; }
        @keyframes vc_onda { 0% { transform: scale(.9); opacity: .9; } 100% { transform: scale(2.3); opacity: 0; } }
        @keyframes vc_sh { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-16deg); } 75% { transform: rotate(16deg); } }
        @keyframes vc_resp { 50% { transform: scale(1.12); } }
        .box b { font-size: 19px; font-weight: 800; text-shadow: 0 0 12px #00E676; margin-top: 6px; } .box span { font-size: 12.5px; color: #aab6c8; padding: 0 14px; }
        .eq { display: flex; gap: 5px; align-items: flex-end; height: 24px; margin-top: 4px; }
        .eq i { width: 6px; border-radius: 3px; background: #69F0AE; box-shadow: 0 0 6px #69F0AE; animation: vc_eq .85s ease-in-out infinite; }
        .eq i:nth-child(2) { animation-delay: .15s; } .eq i:nth-child(3) { animation-delay: .3s; } .eq i:nth-child(4) { animation-delay: .45s; } .eq i:nth-child(5) { animation-delay: .6s; }
        @keyframes vc_eq { 0%,100% { height: 5px; } 50% { height: 24px; } }
  - type: grid
    columns: 3
    square: false
    cards:
    - type: custom:button-card
      entity: button.videocitofono_apri_cancelletto
      name: Apri Cancelletto
      show_name: false
      show_state: false
      show_icon: false
      show_entity_picture: false
      tap_action:
        action: none
      double_tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.videocitofono_apri_cancelletto
      hold_action:
        action: none
      styles:
        card:
        - padding: '0'
        - background: transparent
        - border: none
        - box-shadow: none
        grid:
        - grid-template-areas: '"cg"'
        - grid-template-columns: 1fr
        custom_fields:
          cg:
          - width: 100%
      custom_fields:
        cg: |-
          [[[

          const s = states['binary_sensor.videocitofono_connesso']?.state === 'on' ? 'off' : 'unavailable';
          const na = !s || s === 'unavailable' || s === 'unknown';
          // ora dell'ultimo VERO impulso (sensore template): last_changed si azzera ai riavvii di HA
          const t0 = Date.parse(states['button.videocitofono_apri_cancelletto']?.state);
          let el = isNaN(t0) ? 1e9 : (Date.now() - t0) / 1000;
          if (s === 'on' && el > 5) el = 0;  // impulso appena dato, sensore non ancora arrivato
          const att = !na && (s === 'on' || el < 8);
          return `<div class="pt"><div class="cg ct ${na ? 'na' : att ? 'att' : ''}" style="--c0:${na ? '#7a7891' : '#39E58C'};--d:${att ? (-Math.max(0, el)).toFixed(2) : 0}s">
            <svg viewBox="0 0 64 40">
              <path class="suolo" d="M1 36.5 H63"/>
              <rect x="1" y="14" width="12" height="22.5" class="pil" opacity=".55"/>
              <rect x="51" y="14" width="12" height="22.5" class="pil" opacity=".55"/>
              <rect x="18" y="8" width="28" height="28.5" class="vano"/>
              <rect x="13" y="7" width="5" height="29.5" rx=".6" class="pil"/>
              <rect x="46" y="7" width="5" height="29.5" rx=".6" class="pil"/>
              <rect x="11.5" y="4.6" width="41" height="3" rx=".5" class="arch"/>
