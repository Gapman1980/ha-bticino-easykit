              const vecchi = (window.__vcEvid && window.__vcEvid.fino > Date.now()) ? window.__vcEvid.ids : [];
              window.__vcEvid = { ids: [...new Set([...vecchi, ...v.filter(x => x.nuova).map(x => x.id)])], fino: Date.now() + 86400000 };
              window.__vcPub('visto');
            }
          }, 1200);
        }
        const ev = (window.__vcEvid && window.__vcEvid.fino > Date.now()) ? window.__vcEvid.ids.filter(i => v.some(x => x.id === i)) : [];
        const E = { risposta: ['#00E676', 'mdi:phone-check', 'Risposto'], persa: ['#FF1744', 'mdi:phone-missed', 'Persa'], squillo: ['#FFB300', 'mdi:bell-ring', 'Squillo'] };
        const GG = ['dom', 'lun', 'mar', 'mer', 'gio', 'ven', 'sab'];
        const oggi = new Date(), ieri = new Date(Date.now() - 86400000);
        const att = s => String(s).replace(/"/g, '&quot;');
