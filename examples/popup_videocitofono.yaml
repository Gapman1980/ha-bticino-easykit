    custom_fields:
      s: |-
        [[[
        const v = (entity && entity.attributes && entity.attributes.voci) || [];
        const nv = (entity && entity.attributes && entity.attributes.nuove) || 0;
        const HS = () => document.querySelector('home-assistant')?.hass;
        window.__vcPub = (cmd, p) => { const h = HS(); if (h) h.callService('mqtt', 'publish', { topic: 'bticino_easykit/cmd/storico/' + cmd, payload: p || 'PRESS' }); };
        window.__vcZoom = (el, src, tit, fine) => {
          const o = document.createElement('div');
          o.style.cssText = 'position:fixed;inset:0;z-index:2147483647;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px;cursor:zoom-out';
          o.innerHTML = '<img src="' + src + '" style="max-width:100%;max-height:82vh;border-radius:14px;box-shadow:0 0 30px #000">' +
            '<div style="color:#fff;font:700 15px system-ui">' + tit + '</div><div style="color:#90a4ae;font:12px system-ui">tocca per chiudere</div>';
          o.onpointerup = e => { e.stopPropagation(); e.preventDefault(); setTimeout(() => { o.remove(); if (fine) fine(); }, 60); };
          (el.getRootNode() || document.body).appendChild(o);
        };
        window.__vcDown = e => { window.__vcP = [e.clientX, e.clientY]; };
        window.__vcFermo = e => { const p = window.__vcP || [e.clientX, e.clientY]; window.__vcP = null; return Math.abs(e.clientX - p[0]) < 12 && Math.abs(e.clientY - p[1]) < 12; };
        window.__vcAct = (e) => {
          e.stopPropagation(); e.preventDefault();
          const k = e.currentTarget, d = k.dataset, box = k.closest('.st');
          if (!window.__vcFermo(e)) return;          // era uno scorrimento, non un tocco
          if (d.act === 'zoom') {                     // foto grande; quando si chiude la chiamata conta come vista (via 'NUOVA')
            const r = k.closest('.it');
            window.__vcZoom(k, d.src, d.tit, () => { if (r) { r.classList.remove('nv'); r.querySelector('.es em')?.remove(); }
              if (window.__vcEvid) window.__vcEvid.ids = window.__vcEvid.ids.filter(i => i !== (r && r.dataset.id)); });
            return;
          }
          k.classList.add('uno'); setTimeout(() => k.classList.remove('uno'), 250);   // cestino e scopa: tocco singolo + conferma
          const c = box.querySelector('.cf');
          c.innerHTML = '<ha-icon icon="' + (d.act === 'svuota' ? 'mdi:broom' : 'mdi:trash-can-outline') + '"></ha-icon><span>' + d.txt + '</span>' +
