          c.querySelector('.si').onpointerup = x => {
            x.stopPropagation(); c.classList.remove('on');
            if (d.act === 'svuota') { box.querySelectorAll('.it').forEach(r => r.classList.add('via')); window.__vcPub('svuota'); }
            else { const r = box.querySelector('.it[data-id="' + d.id + '"]'); if (r) r.classList.add('via'); window.__vcPub('elimina', d.id); }
          };
        };
        // aprendo il popup: il pallino sulla mini card sparisce; la scritta NUOVA resta finche' non si guarda la foto grande
        if (nv > 0 && !window.__vcVistoT) {
          window.__vcVistoT = 1; const me = this;
          setTimeout(() => {
            window.__vcVistoT = 0;
